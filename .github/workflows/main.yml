name: Security Scan

on:
  push:
    branches:
      - main
      - dev
      - staging
  pull_request:
    branches:
      - prod

jobs:
  tfsec:
    name: Run tfsec security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Install tfsec
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
      - name: Run tfsec
        run: tfsec .
